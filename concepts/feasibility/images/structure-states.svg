<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title description">
  <title id="title">Three-category structure feasibility matrix</title>
  <desc id="description">Two unique faction headquarters, followed by one shared Resource Point and one shared Production Outpost shown in neutral, Astral Concord, and Gravebound Court ownership states.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11182a"/>
      <stop offset="1" stop-color="#080b13"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74809a"/>
      <stop offset="1" stop-color="#293246"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4c7ad"/>
      <stop offset="1" stop-color="#514b51"/>
    </linearGradient>
    <pattern id="astralPattern" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="18" fill="#50d8ff" opacity=".24"/>
    </pattern>
    <pattern id="gravePattern" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M0 0v20" stroke="#b186ff" stroke-width="6" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="resourceBase">
      <ellipse cx="0" cy="42" rx="112" ry="44" fill="#05070d" opacity=".8"/>
      <ellipse cx="0" cy="25" rx="104" ry="43" fill="#30394c" stroke="#7f899e" stroke-width="4"/>
      <ellipse cx="0" cy="20" rx="76" ry="29" fill="#161c2b" stroke="#5d677c" stroke-width="3"/>
      <path d="M-68 12h136M-45 -1h90" stroke="#788398" stroke-width="3" opacity=".55"/>
      <path d="M0 22V-110" stroke="#c8cfdf" stroke-width="8"/>
      <circle cx="0" cy="-113" r="12" fill="#e1e7f2"/>
    </g>
    <g id="outpostBase">
      <ellipse cx="0" cy="61" rx="126" ry="42" fill="#05070d" opacity=".8"/>
      <path d="M-112 12L0-40l112 52v66L0 128l-112-50z" fill="#293247" stroke="#778198" stroke-width="4"/>
      <path d="M-76 14L0-22l76 36v48L0 98l-76-36z" fill="#141a28" stroke="#5d677c" stroke-width="3"/>
      <path d="M-94 2v-46h30v33M94 2v-46H64v33" fill="none" stroke="#7d879b" stroke-width="12"/>
      <rect x="-26" y="41" width="52" height="58" rx="5" fill="#070a12" stroke="#8b96aa" stroke-width="3"/>
    </g>
  </defs>

  <rect width="1600" height="1020" fill="#060810"/>
  <path d="M0 148H1600M0 442H1600M0 691H1600" stroke="#252b3d"/>
  <text x="70" y="68" fill="#a9a7ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4">PHASE 1A · STRUCTURE TAXONOMY</text>
  <text x="70" y="112" fill="#f5f6fb" font-family="system-ui, sans-serif" font-size="42" font-weight="600">Exactly three categories. Ownership does not create a fourth.</text>

  <text x="70" y="196" fill="#8d93a7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">01 · FACTION-UNIQUE HEADQUARTERS</text>
  <g transform="translate(480 312)">
    <rect x="-290" y="-85" width="580" height="185" rx="10" fill="url(#panel)" stroke="#2d3650"/>
    <ellipse cy="59" rx="145" ry="35" fill="#02040a" opacity=".75"/>
    <path d="M-122 56V-22L-72-64h144l50 42v78z" fill="url(#stone)" stroke="#d4d9e5" stroke-width="4"/>
    <path d="M-78-61V-106h34v23M78-61v-45H44v23" fill="none" stroke="#dce3ee" stroke-width="15"/>
    <path d="M-31 56V4h62v52M0-103V-151" stroke="#e9edf5" stroke-width="9"/>
    <path d="M0-169l18 32H-18z" fill="#44d8ff" filter="url(#glow)"/>
    <path d="M-126-14h252" stroke="#d5a54f" stroke-width="9"/>
    <text x="0" y="91" text-anchor="middle" fill="#eef4ff" font-family="system-ui, sans-serif" font-size="19" font-weight="650">Astral Concord HQ</text>
  </g>
  <g transform="translate(1120 312)">
    <rect x="-290" y="-85" width="580" height="185" rx="10" fill="url(#panel)" stroke="#2d3650"/>
    <ellipse cy="59" rx="145" ry="35" fill="#02040a" opacity=".75"/>
    <path d="M-128 58V-10l36-57 41 24 51-83 51 83 41-24 36 57v68z" fill="#272231" stroke="url(#bone)" stroke-width="5"/>
    <path d="M-91-67l-17-51 40 35M91-67l17-51-40 35M0-126v-50" fill="none" stroke="#b8aa96" stroke-width="12"/>
    <path d="M-30 58V2h60v56" fill="#09070e" stroke="#80728d" stroke-width="4"/>
    <path d="M0-191l14 30H-14z" fill="#a26cff" filter="url(#glow)"/>
    <path d="M-128-4h256" stroke="#8b62bb" stroke-width="9"/>
    <text x="0" y="91" text-anchor="middle" fill="#f4efff" font-family="system-ui, sans-serif" font-size="19" font-weight="650">Gravebound Court HQ</text>
  </g>

  <text x="70" y="488" fill="#8d93a7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">02 · SHARED RESOURCE POINT</text>
  <g transform="translate(365 604)">
    <use href="#resourceBase"/>
    <path d="M6-99h72v49H6z" fill="#666d7c" stroke="#d1d5df" stroke-width="3"/>
    <circle cx="0" cy="25" r="119" fill="none" stroke="#939bad" stroke-width="4" stroke-dasharray="7 12"/>
    <text y="89" text-anchor="middle" fill="#c6cad5" font-family="system-ui, sans-serif" font-size="18">Neutral · dashed ring</text>
  </g>
  <g transform="translate(800 604)">
    <use href="#resourceBase"/>
    <path d="M6-99h72v49H6z" fill="#153f70" stroke="#62dcff" stroke-width="3"/>
    <path d="M42-89l13 14-13 14-13-14z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="25" r="119" fill="url(#astralPattern)" stroke="#53d9ff" stroke-width="5"/>
    <text y="89" text-anchor="middle" fill="#dff9ff" font-family="system-ui, sans-serif" font-size="18">Concord · diamond + diagonal fill</text>
  </g>
  <g transform="translate(1235 604)">
    <use href="#resourceBase"/>
    <path d="M6-99h72v49H6z" fill="#3a2459" stroke="#bd93ff" stroke-width="3"/>
    <path d="M28-91l27 31M55-91L28-60" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="25" r="119" fill="url(#gravePattern)" stroke="#b589ff" stroke-width="5"/>
    <text y="89" text-anchor="middle" fill="#f0e8ff" font-family="system-ui, sans-serif" font-size="18">Court · crossed mark + reverse fill</text>
  </g>

  <text x="70" y="737" fill="#8d93a7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">03 · SHARED PRODUCTION OUTPOST</text>
  <g transform="translate(365 826)">
    <use href="#outpostBase"/>
    <path d="M-105 80h210" stroke="#939bad" stroke-width="7" stroke-dasharray="7 12"/>
    <text y="156" text-anchor="middle" fill="#c6cad5" font-family="system-ui, sans-serif" font-size="18">Neutral · no banner</text>
  </g>
  <g transform="translate(800 826)">
    <use href="#outpostBase"/>
    <path d="M-105 80h210" stroke="#53d9ff" stroke-width="7"/>
    <path d="M-93-42v-67M-90-106h55v40h-55z" fill="#153f70" stroke="#62dcff" stroke-width="3"/>
    <path d="M-63-98l11 12-11 12-11-12z" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M-65 11H65V81H-65z" fill="url(#astralPattern)" opacity=".7"/>
    <text y="156" text-anchor="middle" fill="#dff9ff" font-family="system-ui, sans-serif" font-size="18">Concord · banner + diamond pattern</text>
  </g>
  <g transform="translate(1235 826)">
    <use href="#outpostBase"/>
    <path d="M-105 80h210" stroke="#b589ff" stroke-width="7"/>
    <path d="M-93-42v-67M-90-106h55v40h-55z" fill="#3a2459" stroke="#bd93ff" stroke-width="3"/>
    <path d="M-75-98l25 24M-50-98l-25 24" stroke="#fff" stroke-width="4"/>
    <path d="M-65 11H65V81H-65z" fill="url(#gravePattern)" opacity=".7"/>
    <text y="156" text-anchor="middle" fill="#f0e8ff" font-family="system-ui, sans-serif" font-size="18">Court · crossed mark + reverse pattern</text>
  </g>
</svg>
