<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title description">
  <title id="title">Aeon of Kingdoms authored map layers</title>
  <desc id="description">Six panels separate ground, nonblocking detail, navigation and blockers, anchors, dynamic depth order, and foreground occlusion for one map excerpt.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253244"/>
      <stop offset=".55" stop-color="#172333"/>
      <stop offset="1" stop-color="#111726"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8b93a9" stroke-width="1" opacity=".28"/>
    </pattern>
    <pattern id="blocked" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="14" fill="#f26b78" opacity=".5"/>
    </pattern>
    <g id="mapBase">
      <rect width="450" height="310" rx="10" fill="url(#ground)"/>
      <path d="M-20 258C96 232 110 118 236 135s135 101 238 62" fill="none" stroke="#7c725f" stroke-width="58" opacity=".42"/>
      <path d="M-20 258C96 232 110 118 236 135s135 101 238 62" fill="none" stroke="#a69a7d" stroke-width="6" opacity=".42"/>
      <path d="M15 83l66-60 76 23 44 91-57 58-107-15z" fill="#30374d" stroke="#71809a" stroke-width="3"/>
      <path d="M310 23l99 34 32 92-79 36-72-59z" fill="#30374d" stroke="#71809a" stroke-width="3"/>
      <path d="M52 72l34-30 27 34 27-18 39 86-61 27-77-17zM330 62l40-24 50 42 4 49-63 33-49-48z" fill="#4b526b"/>
    </g>
    <g id="entity">
      <ellipse cy="12" rx="14" ry="6" fill="#02040a" opacity=".65"/>
      <circle cy="-4" r="11" fill="#e8edf6" stroke="#46d8ff" stroke-width="3"/>
      <path d="M-10-5L0-27 10-5" fill="#4164a8"/>
    </g>
  </defs>

  <rect width="1600" height="1040" fill="#060810"/>
  <text x="70" y="68" fill="#a9a7ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4">PHASE 1A · MAP AUTHORING</text>
  <text x="70" y="112" fill="#f5f6fb" font-family="system-ui, sans-serif" font-size="42" font-weight="600">The painting never decides where an entity may walk.</text>

  <g transform="translate(70 170)">
    <rect width="450" height="390" rx="12" fill="#0b0e18" stroke="#2d354b"/>
    <use href="#mapBase"/>
    <text x="22" y="340" fill="#f2f4fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">01 · Ground</text>
    <text x="22" y="368" fill="#8f96a9" font-family="system-ui, sans-serif" font-size="16">broad terrain only</text>
  </g>

  <g transform="translate(575 170)">
    <rect width="450" height="390" rx="12" fill="#0b0e18" stroke="#2d354b"/>
    <use href="#mapBase"/>
    <g fill="#8ea06f" opacity=".85">
      <circle cx="236" cy="82" r="6"/><circle cx="254" cy="71" r="4"/><circle cx="275" cy="93" r="7"/>
      <circle cx="203" cy="238" r="7"/><circle cx="223" cy="252" r="5"/><circle cx="260" cy="261" r="4"/>
    </g>
    <path d="M69 260l35-18M130 217l30-12M268 156l32 14M353 199l30-8" stroke="#cabf9d" stroke-width="3" opacity=".7"/>
    <text x="22" y="340" fill="#f2f4fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">02 · Detail</text>
    <text x="22" y="368" fill="#8f96a9" font-family="system-ui, sans-serif" font-size="16">roads, decals, no collision</text>
  </g>

  <g transform="translate(1080 170)">
    <rect width="450" height="390" rx="12" fill="#0b0e18" stroke="#2d354b"/>
    <use href="#mapBase" opacity=".35"/>
    <rect width="450" height="310" fill="url(#grid)"/>
    <path d="M15 83l66-60 76 23 44 91-57 58-107-15zM310 23l99 34 32 92-79 36-72-59z" fill="url(#blocked)" stroke="#ff8b95" stroke-width="4"/>
    <path d="M-20 258C96 232 110 118 236 135s135 101 238 62" fill="none" stroke="#62d8ff" stroke-width="18" opacity=".75"/>
    <text x="22" y="340" fill="#f2f4fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">03 · Navigation</text>
    <text x="22" y="368" fill="#8f96a9" font-family="system-ui, sans-serif" font-size="16">grid, clearance, blockers</text>
  </g>

  <g transform="translate(70 590)">
    <rect width="450" height="390" rx="12" fill="#0b0e18" stroke="#2d354b"/>
    <use href="#mapBase" opacity=".42"/>
    <g fill="none" stroke-width="4">
      <circle cx="68" cy="246" r="18" stroke="#56dcff"/><path d="M58 246h20M68 236v20" stroke="#56dcff"/>
      <rect x="348" y="198" width="36" height="36" stroke="#b589ff"/><path d="M348 198l36 36M384 198l-36 36" stroke="#b589ff"/>
      <path d="M229 117l18 18-18 18-18-18z" stroke="#ffe08a"/>
    </g>
    <path d="M68 246L229 135 366 216" fill="none" stroke="#bbc2d1" stroke-width="3" stroke-dasharray="8 9"/>
    <text x="22" y="340" fill="#f2f4fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">04 · Anchors</text>
    <text x="22" y="368" fill="#8f96a9" font-family="system-ui, sans-serif" font-size="16">spawn, structure, objective</text>
  </g>

  <g transform="translate(575 590)">
    <rect width="450" height="390" rx="12" fill="#0b0e18" stroke="#2d354b"/>
    <use href="#mapBase" opacity=".72"/>
    <g transform="translate(205 224)"><use href="#entity"/></g>
    <g transform="translate(245 199)"><use href="#entity"/></g>
    <g transform="translate(285 174)"><use href="#entity"/></g>
    <path d="M170 267h150" stroke="#ffe08a" stroke-width="2"/>
    <path d="M185 270l20-14M225 270l20-14M265 270l20-14" stroke="#ffe08a" stroke-width="2"/>
    <text x="22" y="340" fill="#f2f4fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">05 · Dynamic order</text>
    <text x="22" y="368" fill="#8f96a9" font-family="system-ui, sans-serif" font-size="16">sort by ground contact</text>
  </g>

  <g transform="translate(1080 590)">
    <rect width="450" height="390" rx="12" fill="#0b0e18" stroke="#2d354b"/>
    <use href="#mapBase" opacity=".7"/>
    <g transform="translate(134 151)"><use href="#entity"/></g>
    <path d="M15 83l66-60 76 23 44 91-57 58-107-15z" fill="#171d2b" opacity=".78"/>
    <path d="M52 72l34-30 27 34 27-18 39 86-61 27-77-17z" fill="#68708a" opacity=".92"/>
    <ellipse cx="134" cy="147" rx="24" ry="31" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 5"/>
    <path d="M194 144h58" stroke="#fff" stroke-width="2"/><text x="262" y="150" fill="#fff" font-family="system-ui, sans-serif" font-size="15">selected outline</text>
    <text x="22" y="340" fill="#f2f4fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">06 · Foreground</text>
    <text x="22" y="368" fill="#8f96a9" font-family="system-ui, sans-serif" font-size="16">split art + local outline</text>
  </g>

  <text x="70" y="1010" fill="#8f96a9" font-family="system-ui, sans-serif" font-size="17">One authored map definition owns all six layers. No 3D physics or height engine is implied.</text>
</svg>
