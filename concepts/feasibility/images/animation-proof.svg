<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Four-family animation feasibility sheet</title>
  <desc id="description">Astral and Gravebound representative melee entities shown in idle, move, attack, and defeat key poses with stable foot anchors and attack contact timing.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12182a"/><stop offset="1" stop-color="#080b13"/></linearGradient>
    <g id="anchor">
      <circle r="9" fill="none" stroke="#6f778b" stroke-width="2"/>
      <path d="M-15 0h30M0-15v30" stroke="#6f778b" stroke-width="2"/>
    </g>
    <g id="astralBody">
      <circle cy="-102" r="20" fill="#e7e3d5" stroke="#d7a94f" stroke-width="5"/>
      <path d="M-33-80L-22-25H22L33-80 0-98z" fill="#e7e3d5" stroke="#d7a94f" stroke-width="5"/>
      <path d="M-23-65h46" stroke="#2f65a9" stroke-width="12"/>
      <path d="M-18-25L-25 0M18-25L25 0" stroke="#d7d9df" stroke-width="13" stroke-linecap="round"/>
      <path d="M-28-73L-55-33M28-73L55-33" stroke="#d7d9df" stroke-width="13" stroke-linecap="round"/>
    </g>
    <g id="graveBody">
      <circle cy="-102" r="19" fill="#d6c9ae" stroke="#4e4656" stroke-width="5"/>
      <path d="M-29-80L-20-26H20L29-80 0-96z" fill="#262331" stroke="#b189f3" stroke-width="5"/>
      <path d="M-20-26L-27 0M20-26L27 0" stroke="#bcae96" stroke-width="12" stroke-linecap="round"/>
      <path d="M-28-72L-54-35M28-72L54-35" stroke="#bcae96" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g id="shield"><ellipse cy="-43" rx="27" ry="38" fill="#244e88" stroke="#e2bc68" stroke-width="5"/><path d="M0-61l11 18L0-25l-11-18z" fill="#5be0ff"/></g>
    <g id="sword"><path d="M0-2V-77" stroke="#e9edf6" stroke-width="9"/><path d="M0-90l10 18H-10z" fill="#e9edf6"/><path d="M-14-6h28" stroke="#d7a94f" stroke-width="6"/></g>
    <g id="hook"><path d="M0 0V-62c0-33 32-44 47-22-22-6-31 10-31 29" fill="none" stroke="#d6c9ae" stroke-width="12"/><path d="M39-97l19 17-25 5z" fill="#d6c9ae"/></g>
  </defs>

  <rect width="1600" height="980" fill="#060810"/>
  <text x="70" y="68" fill="#a9a7ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="4">PHASE 1A · ANIMATION METHOD</text>
  <text x="70" y="112" fill="#f5f6fb" font-family="system-ui, sans-serif" font-size="42" font-weight="600">Four authored families. One stable ground anchor.</text>

  <g font-family="system-ui, sans-serif">
    <text x="88" y="190" fill="#70dcff" font-size="20" font-weight="700" letter-spacing="3">ASTRAL GUARDIAN</text>
    <text x="88" y="565" fill="#bb93ff" font-size="20" font-weight="700" letter-spacing="3">GRAVEBOUND REAVER</text>
  </g>

  <g transform="translate(235 340)">
    <rect x="-150" y="-120" width="300" height="270" rx="12" fill="url(#panel)" stroke="#2c354d"/>
    <use href="#anchor"/><use href="#astralBody"/><g transform="translate(-53 -28)"><use href="#shield"/></g><g transform="translate(57 -28) rotate(8)"><use href="#sword"/></g>
    <text x="0" y="125" text-anchor="middle" fill="#f3f5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">Idle</text>
  </g>
  <g transform="translate(615 340)">
    <rect x="-150" y="-120" width="300" height="270" rx="12" fill="url(#panel)" stroke="#2c354d"/>
    <use href="#anchor"/><g transform="rotate(-7)"><use href="#astralBody"/></g><g transform="translate(-60 -34) rotate(-10)"><use href="#shield"/></g><g transform="translate(64 -18) rotate(28)"><use href="#sword"/></g>
    <path d="M-88 14h-42M-77 35h-31" stroke="#58dbff" stroke-width="5" opacity=".65"/>
    <text x="0" y="125" text-anchor="middle" fill="#f3f5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">Move</text>
  </g>
  <g transform="translate(995 340)">
    <rect x="-150" y="-120" width="300" height="270" rx="12" fill="url(#panel)" stroke="#2c354d"/>
    <use href="#anchor"/><g transform="translate(-9 0) rotate(9)"><use href="#astralBody"/></g><g transform="translate(-58 -31) rotate(8)"><use href="#shield"/></g><g transform="translate(83 -79) rotate(74)"><use href="#sword"/></g>
    <path d="M86-84q38 40 0 80" fill="none" stroke="#ffe08a" stroke-width="5" stroke-dasharray="7 6"/>
    <text x="0" y="125" text-anchor="middle" fill="#f3f5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">Attack</text>
  </g>
  <g transform="translate(1375 340)">
    <rect x="-150" y="-120" width="300" height="270" rx="12" fill="url(#panel)" stroke="#2c354d"/>
    <use href="#anchor"/><g transform="translate(-12 3) rotate(72)"><use href="#astralBody"/></g><g transform="translate(-68 12) rotate(88)"><use href="#shield"/></g><g transform="translate(72 17) rotate(102)"><use href="#sword"/></g>
    <text x="0" y="125" text-anchor="middle" fill="#f3f5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">Defeat</text>
  </g>

  <g transform="translate(235 715)">
    <rect x="-150" y="-120" width="300" height="270" rx="12" fill="url(#panel)" stroke="#2c354d"/>
    <use href="#anchor"/><use href="#graveBody"/><g transform="translate(57 -28) rotate(8)"><use href="#hook"/></g>
    <text x="0" y="125" text-anchor="middle" fill="#f3f5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">Idle</text>
  </g>
  <g transform="translate(615 715)">
    <rect x="-150" y="-120" width="300" height="270" rx="12" fill="url(#panel)" stroke="#2c354d"/>
    <use href="#anchor"/><g transform="rotate(8)"><use href="#graveBody"/></g><g transform="translate(63 -20) rotate(29)"><use href="#hook"/></g>
    <path d="M-86 13h-42M-76 35h-31" stroke="#b589ff" stroke-width="5" opacity=".72"/>
    <text x="0" y="125" text-anchor="middle" fill="#f3f5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">Move</text>
  </g>
  <g transform="translate(995 715)">
    <rect x="-150" y="-120" width="300" height="270" rx="12" fill="url(#panel)" stroke="#2c354d"/>
    <use href="#anchor"/><g transform="translate(-8 0) rotate(-10)"><use href="#graveBody"/></g><g transform="translate(79 -81) rotate(67)"><use href="#hook"/></g>
    <path d="M73-91q48 39 13 88" fill="none" stroke="#ffbd74" stroke-width="5" stroke-dasharray="7 6"/>
    <text x="0" y="125" text-anchor="middle" fill="#f3f5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">Attack</text>
  </g>
  <g transform="translate(1375 715)">
    <rect x="-150" y="-120" width="300" height="270" rx="12" fill="url(#panel)" stroke="#2c354d"/>
    <use href="#anchor"/><g transform="translate(-9 5) rotate(-70)"><use href="#graveBody"/></g><g transform="translate(70 16) rotate(104)"><use href="#hook"/></g>
    <text x="0" y="125" text-anchor="middle" fill="#f3f5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="650">Defeat</text>
  </g>

  <g transform="translate(85 918)" font-family="system-ui, sans-serif">
    <text fill="#8f96a9" font-size="17">Attack timing:</text>
    <path d="M130 0H760" stroke="#434b62" stroke-width="8"/>
    <path d="M130 0H285" stroke="#7d86a0" stroke-width="8"/><path d="M285 0H500" stroke="#a9a7ff" stroke-width="8"/><path d="M500 0H760" stroke="#5a6176" stroke-width="8"/>
    <path d="M500-17v34" stroke="#ffe08a" stroke-width="4"/>
    <text x="130" y="30" fill="#8f96a9" font-size="14">wind-up</text><text x="305" y="30" fill="#c5c3ff" font-size="14">contact at simulation tick</text><text x="610" y="30" fill="#8f96a9" font-size="14">recover</text>
    <text x="905" y="5" fill="#8f96a9" font-size="17">Pose board only · shipping motion uses a controlled master</text>
  </g>
</svg>
