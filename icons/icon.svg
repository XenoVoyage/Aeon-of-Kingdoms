<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Aeon of Kingdoms</title>
  <desc id="desc">A cyan and violet geometric Aeon sigil on deep space blue.</desc>
