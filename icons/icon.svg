      <stop offset="0" stop-color="#152650"/>
      <stop offset="0.5" stop-color="#090f24"/>
      <stop offset="1" stop-color="#03050d"/>
    </radialGradient>
    <linearGradient id="energy" x1="96" y1="72" x2="416" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91f2ff"/>
      <stop offset="0.48" stop-color="#4de8ff"/>
